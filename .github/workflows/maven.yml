# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match spring.data.redis.password in src/main/resources/application.yml
  REDIS_PASSWORD: eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the dependency submission step

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # The contextLoads test boots the full application, which connects to Redis (Redisson + bucket4j)
    - name: Start Redis
      run: |
        docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass "$REDIS_PASSWORD"
        for i in $(seq 1 30); do
          if docker exec redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; then
            echo "Redis is ready"; exit 0
          fi
          sleep 1
        done
        echo "Redis did not become ready in time"; docker logs redis; exit 1

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
